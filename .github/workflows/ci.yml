name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    env:
      # Only needed so the Prisma client can be generated; nothing connects to
      # a database during CI (the suite mocks the client).
      DATABASE_URL: postgresql://user:password@localhost:5432/ejentic?schema=public
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  migrate:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ejentic
          POSTGRES_USER: ejentic
          POSTGRES_PASSWORD: ejentic
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ejentic:ejentic@localhost:5432/ejentic?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catches a migration that was hand-written but never actually run, or
      # that references a column/type which does not exist.
      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify schema matches migrations
        run: npx prisma migrate status
